name: BTC paper monitor

on:
  # Safety net only: the VPS's own cron drives workflow_dispatch every 15
  # minutes and is the primary trigger. This fires once an hour, offset away
  # from the VPS's :03/:18/:33/:48 pattern, so it almost never races the same
  # cycle and only matters if the VPS itself goes down.
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "runtime/**"

permissions:
  contents: write
  issues: write

concurrency:
  group: btc-paper-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: self-hosted
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run safety and engine tests
        run: python -m unittest discover -s tests -v

      - name: Evaluate closed candles
        id: monitor
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m monitor.runner

      - name: Open one notification for new events
        if: hashFiles('runtime/new_events.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python tools/post_new_events_issue.py
          rm -f runtime/new_events.md

      - name: Persist paper registry and health
        run: |
          rm -f runtime/new_events.md runtime/run_result.json
          git config user.name "btc-paper-monitor[bot]"
          git config user.email "btc-paper-monitor[bot]@users.noreply.github.com"
          git add runtime/
          if git diff --cached --quiet; then
            echo "No tracked state changes."
            exit 0
          fi
          git commit -m "chore: update paper monitor state [skip ci]"
          # A second trigger (schedule as well as workflow_dispatch) can land
          # close enough to race this push. Rebase onto whatever landed first
          # and retry instead of failing the run and losing this state.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main and retrying."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "::error::Could not push paper monitor state after 5 attempts."
          exit 1

      - name: Fail workflow after state is preserved
        if: steps.monitor.outcome == 'failure'
        run: exit 1
